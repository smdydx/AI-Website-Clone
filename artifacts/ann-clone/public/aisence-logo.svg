<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 60" fill="none">
  <defs>
    <linearGradient id="sg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6600FF"/>
      <stop offset="100%" stop-color="#00C8D4"/>
    </linearGradient>
    <linearGradient id="sg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C8D4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6600FF" stop-opacity="0.08"/>
    </linearGradient>
    <radialGradient id="sg3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00C8D4"/>
      <stop offset="100%" stop-color="#6600FF"/>
    </radialGradient>
    <filter id="sglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ssoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Icon: Neural Sensor (30x60 area, centered at 30,30) -->

  <!-- Outer glow ring -->
  <circle cx="30" cy="30" r="27" fill="url(#sg2)" filter="url(#sglow)"/>

  <!-- Outer dashed ring -->
  <circle cx="30" cy="30" r="25" stroke="url(#sg1)" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>

  <!-- Mid scan arc top -->
  <path d="M 12 21 A 20 20 0 0 1 48 21" stroke="url(#sg1)" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.6" filter="url(#ssoft)"/>

  <!-- Mid scan arc bottom -->
  <path d="M 12 39 A 20 20 0 0 0 48 39" stroke="url(#sg1)" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.4" filter="url(#ssoft)"/>

  <!-- Inner hexagon -->
  <path d="M 30 17 L 39 22 L 39 32 L 30 37 L 21 32 L 21 22 Z"
        stroke="url(#sg1)" stroke-width="1.3" fill="none" opacity="0.8" filter="url(#ssoft)"/>

  <!-- Neural nodes: left, right, top, bottom -->
  <circle cx="30" cy="30" r="4.5" fill="url(#sg3)" filter="url(#sglow)"/>
  <circle cx="30" cy="28.5" r="1.2" fill="white" opacity="0.55"/>

  <!-- Branch lines -->
  <line x1="30" y1="17" x2="30" y2="25.5" stroke="#00C8D4" stroke-width="0.9" opacity="0.6" stroke-linecap="round"/>
  <line x1="39" y1="22" x2="33.5" y2="27" stroke="#6600FF" stroke-width="0.9" opacity="0.6" stroke-linecap="round"/>
  <line x1="39" y1="32" x2="33.5" y2="32" stroke="#6600FF" stroke-width="0.9" opacity="0.6" stroke-linecap="round"/>
  <line x1="30" y1="37" x2="30" y2="34.5" stroke="#00C8D4" stroke-width="0.9" opacity="0.6" stroke-linecap="round"/>
  <line x1="21" y1="32" x2="26.5" y2="32" stroke="#6600FF" stroke-width="0.9" opacity="0.6" stroke-linecap="round"/>
  <line x1="21" y1="22" x2="26.5" y2="27" stroke="#6600FF" stroke-width="0.9" opacity="0.6" stroke-linecap="round"/>

  <!-- Vertex dots -->
  <circle cx="30" cy="17" r="1.8" fill="#00C8D4" opacity="0.9" filter="url(#ssoft)"/>
  <circle cx="39" cy="22" r="1.5" fill="#6600FF" opacity="0.8"/>
  <circle cx="39" cy="32" r="1.5" fill="#6600FF" opacity="0.8"/>
  <circle cx="30" cy="37" r="1.8" fill="#00C8D4" opacity="0.9" filter="url(#ssoft)"/>
  <circle cx="21" cy="32" r="1.5" fill="#6600FF" opacity="0.8"/>
  <circle cx="21" cy="22" r="1.5" fill="#6600FF" opacity="0.8"/>

  <!-- Pulse dots on outer ring -->
  <circle cx="30" cy="5" r="1.8" fill="#00C8D4" opacity="0.7" filter="url(#sglow)"/>
  <circle cx="52" cy="17" r="1.4" fill="#6600FF" opacity="0.6"/>
  <circle cx="52" cy="43" r="1.4" fill="#6600FF" opacity="0.6"/>
  <circle cx="30" cy="55" r="1.8" fill="#00C8D4" opacity="0.7"/>
  <circle cx="8"  cy="43" r="1.4" fill="#6600FF" opacity="0.6"/>
  <circle cx="8"  cy="17" r="1.4" fill="#6600FF" opacity="0.6"/>

  <!-- Wordmark: "Ai" white + "Sence" gradient -->
  <text x="68" y="37"
        font-family="'Segoe UI', system-ui, -apple-system, sans-serif"
        font-weight="800" font-size="25" letter-spacing="-0.8" fill="white">Ai</text>

  <text x="98" y="37"
        font-family="'Segoe UI', system-ui, -apple-system, sans-serif"
        font-weight="800" font-size="25" letter-spacing="-0.8" fill="url(#sg1)">Sence</text>

  <!-- Tagline -->
  <text x="69" y="49"
        font-family="'Segoe UI', system-ui, -apple-system, sans-serif"
        font-weight="500" font-size="7.2" letter-spacing="2.8" fill="#00C8D4" opacity="0.7">INTELLIGENT SENSING · AI</text>
</svg>
